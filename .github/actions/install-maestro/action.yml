name: 'Install Maestro'
description: 'Install Maestro from a pinned GitHub release (avoids flaky get.maestro.mobile.dev)'
inputs:
  version:
    description: 'Maestro release tag to install (e.g. cli-2.3.0)'
    required: false
    default: 'cli-2.3.0'
runs:
  using: composite
  steps:
    - name: Install Maestro
      shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.version }}
      run: |
        maestro_bin="$HOME/.maestro/bin/maestro"

        if [ -f "$maestro_bin" ]; then
          echo "Maestro already installed at $maestro_bin"
          exit 0
        fi

        echo "Installing Maestro ${MAESTRO_VERSION}..."
        curl -fsSL \
          "https://github.com/mobile-dev-inc/maestro/releases/download/${MAESTRO_VERSION}/maestro.zip" \
          -o /tmp/maestro.zip

        unzip -q /tmp/maestro.zip -d /tmp/maestro-extract
        mv /tmp/maestro-extract/maestro "$HOME/.maestro"
        rm -f /tmp/maestro.zip

        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        echo "Maestro installed successfully at $maestro_bin"
