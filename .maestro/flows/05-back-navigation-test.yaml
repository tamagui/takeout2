appId: com.takeout.app.dev
---
# Test 5: Test Back Navigation from Email Input

- launchApp:
    clearState: true

# Handle dev server picker (appears after clearState)
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
      - extendedWaitUntil:
          notVisible: "DEVELOPMENT SERVERS"
          timeout: 20000

# Handle dev menu onboarding (appears after first connect)
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

# Handle dev menu tools screen (close button)
- runFlow:
    when:
      visible:
        id: "xmark"
    commands:
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd

# Wait for login screen
- extendedWaitUntil:
    visible: "Login to Takeout"
    timeout: 30000

# Navigate to email input
- tapOn: "Continue with Email"
- extendedWaitUntil:
    visible: "Sign in or sign up with your email."
    timeout: 10000

# Hide keyboard first to ensure clean state
- hideKeyboard

# Wait for animation to settle
- waitForAnimationToEnd

# Tap the back button using accessibility label
- tapOn: "Go back"

# Wait for navigation animation
- waitForAnimationToEnd

# Verify we're back on login screen
- extendedWaitUntil:
    visible: "Login to Takeout"
    timeout: 10000
- assertVisible: "Continue with Email"
