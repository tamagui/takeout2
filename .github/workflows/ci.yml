name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-tauri:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.commits[0].message, 'docs:')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs-build: ${{ steps.check.outputs.needs-build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Check if Tauri needs rebuild
        id: check
        run: |
          # Check if the update manifest exists
          MANIFEST_URL="${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}/onechatimages/releases/tauri-update.json"
          MANIFEST_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "$MANIFEST_URL" || echo "000")

          if [ "$MANIFEST_EXISTS" != "200" ]; then
            echo "Update manifest not found, Tauri build needed"
            echo "needs-build=true" >> $GITHUB_OUTPUT
          elif bun ./src/tauri/scripts/check-tauri-changed.ts --check; then
            echo "Tauri has not changed"
            echo "needs-build=false" >> $GITHUB_OUTPUT
          else
            echo "Tauri has changed"
            echo "needs-build=true" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}

  build-test-and-deploy:
    if: "!contains(github.event.commits[0].message, 'docs:')"
    timeout-minutes: 18
    # Using Warp runners for ARM64 support (cheaper and faster than GitHub ARM runners)
    # If you don't have Warp, either:
    # 1. Sign up at https://www.warpbuild.com (recommended - cheaper than GitHub)
    # 2. Use GitHub's ubuntu-24.04-arm (requires paid GitHub plan)
    # 3. Use ubuntu-latest and change Docker builds to linux/amd64 in scripts/web/build-docker.ts
    runs-on: ${{ github.ref == 'refs/heads/main' && 'warp-ubuntu-latest-arm64-16x' || 'warp-ubuntu-latest-arm64-4x' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Install
        uses: ./.github/actions/install

      - name: CI/CD
        run: bun run ci release ${{ github.ref != 'refs/heads/main' && '--skip-deploy' || '' }}
        env:
          # 🔒 start - this is generated by "bun env:update"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APNS_ENDPOINT: ${{ secrets.APNS_ENDPOINT }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          DEPLOYMENT_PLATFORM: ${{ secrets.DEPLOYMENT_PLATFORM }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ONE_SERVER_URL: ${{ secrets.ONE_SERVER_URL }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          # 🔒 end - this is generated by "bun env:update"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAT_GITHUB_TOKEN: ${{ secrets.CHAT_GITHUB_TOKEN }}

  tauri-build:
    needs: check-tauri
    if: "needs.check-tauri.outputs.needs-build == 'true' && !contains(github.event.commits[0].message, 'docs:')"
    timeout-minutes: 30
    # TODO: Switch back to Warp runners once configured
    # runs-on: warp-macos-15-arm64-6x
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Install
        uses: ./.github/actions/install

      - name: Build and Upload Tauri
        run: bun ./src/tauri/scripts/build-tauri-ci.ts
        env:
          # Tauri signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY_CONTENTS }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # 🔒 start - this is generated by "bun env:update"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APNS_ENDPOINT: ${{ secrets.APNS_ENDPOINT }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          DEPLOYMENT_PLATFORM: ${{ secrets.DEPLOYMENT_PLATFORM }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ONE_SERVER_URL: ${{ secrets.ONE_SERVER_URL }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          # 🔒 end - this is generated by "bun env:update"

      - name: Create PR for version bump
        if: success()
        run: bun ./src/tauri/scripts/create-version-bump-pr.ts
        env:
          GITHUB_TOKEN: ${{ secrets.CHAT_GITHUB_TOKEN }}
