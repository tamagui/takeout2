name: Build iOS App
env:
  # Relative path from the monorepo root to the app. Use `./` if the app is in the root.
  app_project_path: ./
  # Should match the name of "ios/<app_name>.xcworkspace"
  ios_app_name: Start
  # A unique ID to identify the app on GitHub Actions. This is used as part of cache keys and artifact names and must be unique among all workflows if you have multiple workflows for building different apps.
  app_id: ios-rn-app
  # The command used to prebuild the app.
  prebuild_command: bun run prebuild:native --platform ios --no-install # --no-install is used to skip installing dependencies, specifically `pod install`, as we want to do it after the Cache Pods step.
  # The package manager lock file for npm packages, relative to the repository root
  package_lock_file: bun.lock
  # The directory where the build output will be stored. Relative to the app_project_path.
  build_dir_path: ci_build

on:
  workflow_dispatch:
    inputs:
      # NOTE: Keep these input definitions in sync with workflow_call inputs below
      configuration:
        description: "Either 'Debug' or 'Release'"
        type: choice
        options:
          - Debug
          - Release
        required: true
      destination:
        description: "'iOS-Simulator' or 'iOS'"
        type: choice
        options:
          - iOS-Simulator
          - iOS
        default: 'iOS-Simulator'
      type:
        description: "'build' or 'archive'"
        type: choice
        options:
          - build
          - archive
        default: 'build'
      output-cache-key:
        description: "If specified, the actual build will be skipped if a cached output is found for this key, also the built output will be saved to the cache with this key"
        type: string
      upload-artifact:
        description: "Whether to upload the output .app or archive file as an artifact"
        type: boolean
        default: true

  workflow_call:
    # NOTE: Keep these input definitions in sync with workflow_dispatch inputs above
    inputs:
      configuration:
        description: "Either 'Debug' or 'Release'."
        type: string
        required: true
      destination:
        description: "'iOS-Simulator' or 'iOS'"
        type: string
        default: 'iOS-Simulator'
      type:
        description: "'build' or 'archive'"
        type: string
        default: 'build'
      output-cache-key:
        description: "If specified, the actual build will be skipped if a cached output is found for this key, also the built output will be saved to the cache with this key"
        type: string
      upload-artifact:
        description: "Whether to upload the output .app or archive file as an artifact"
        type: boolean
        default: false

    outputs:
      output-path:
        description: "The path to the built .app or archive file, relative to the repository root."
        value: ${{ jobs.build-ios.outputs.output-path }}
      built-app-path:
        description: "The path to the built .app, relative to the repository root."
        value: ${{ jobs.build-ios.outputs.built-app-path }}
      built-archive-path:
        description: "The path to the built archive file, relative to the repository root."
        value: ${{ jobs.build-ios.outputs.built-archive-path }}
      output-artifact-name:
        description: "The ID of the uploaded artifact which contains the built .app or archive file. Will be empty if artifact upload is not enabled."
        value: ${{ jobs.build-ios.outputs.output-artifact-name }}

jobs:
  build-ios:
    name: Build
    # runs-on: macos-14
    # runs-on: ghcr.io/cirruslabs/macos-runner:sequoia
    runs-on: [macOS, sequoia-xcode-beta]
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 60
    outputs:
      output-path: ${{ steps.get-built-app-info.outputs.output-path }}
      built-app-path: ${{ steps.get-built-app-info.outputs.built-app-path }}
      built-archive-path: ${{ steps.get-built-app-info.outputs.built-archive-path }}
      output-artifact-name: ${{ steps.get-built-app-info.outputs.output-artifact-name }}
    defaults:
      run:
        working-directory: ${{ env.app_project_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Installed Xcodes
        run: xcodes installed

      - name: Select Xcode
        run: xcodes select "$(cat .xcode-version)"

      - name: Get Built App Info
        id: get-built-app-info
        env:
          APP_PROJECT_PATH: ${{ env.app_project_path }}
          BUILD_DIR_PATH: ${{ env.build_dir_path }}
          RELATIVE_BUILT_APP_PATH: Build/Products/${{ inputs.configuration }}-${{ inputs.destination == 'iOS-Simulator' && 'iphonesimulator' || 'iphoneos' }}/${{ env.ios_app_name }}.app
          BUILT_ARCHIVE_PATH: ${{ env.app_project_path }}/${{ env.build_dir_path }}/${{ env.app_id }}.xcarchive
          OUTPUT_ARTIFACT_NAME: ${{ env.app_id }}-${{ inputs.destination }}-${{ inputs.configuration }}-${{ inputs.type }}
        run: |
          echo "relative-built-app-path=$RELATIVE_BUILT_APP_PATH" >> $GITHUB_OUTPUT

          built_app_path="$APP_PROJECT_PATH/$BUILD_DIR_PATH/$RELATIVE_BUILT_APP_PATH"
          echo "Built app path: $built_app_path"
          echo "built-app-path=$built_app_path" >> $GITHUB_OUTPUT

          echo "Archive path: $BUILT_ARCHIVE_PATH"
          echo "built-archive-path=$BUILT_ARCHIVE_PATH" >> $GITHUB_OUTPUT

          echo "Output artifact name: $OUTPUT_ARTIFACT_NAME"
          echo "output-artifact-name=$OUTPUT_ARTIFACT_NAME" >> $GITHUB_OUTPUT

          OUTPUT_PATH="${{ inputs.type == 'build' && '$built_app_path' || '$BUILT_ARCHIVE_PATH' }}"
          echo "Output path: $OUTPUT_PATH"
          echo "output-path=$OUTPUT_PATH" >> $GITHUB_OUTPUT

      - name: Check Cached Output
        id: check-cached-output
        if: ${{ inputs.output-cache-key }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ inputs.output-cache-key }}
          lookup-only: true
          path: ${{ steps.get-built-app-info.outputs.output-path }}


