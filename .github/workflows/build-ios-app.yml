      - name: Get Derived Data Path
        if: ${{ !steps.check-cached-output.outputs.cache-hit }}
        id: get-derived-data-path
        env:
          GITHUB_REPO: ${{ github.repository }}
          BUILD_DIR_PATH: ${{ env.build_dir_path }}
          # DESTINATION: ${{ inputs.destination }}
        run: |
          # On self-hosted runners, we can use `DERIVED_DATA_HOME` to let derived data be stored in a persistent location to speed up subsequent builds.
          if [ -z "$DERIVED_DATA_HOME" ]; then
            derived_data_path="$BUILD_DIR_PATH"
            echo "Using build directory as derived data path: $derived_data_path"
            derived_data_path_customized=''
          else
            echo "Using DERIVED_DATA_HOME: $DERIVED_DATA_HOME"
            # derived_data_path="$DERIVED_DATA_HOME/$GITHUB_REPO/$DESTINATION"
            derived_data_path="$DERIVED_DATA_HOME/$GITHUB_REPO"
            mkdir -p "$derived_data_path"
            echo "Derived data path: $derived_data_path"
            derived_data_path_customized='true'
          fi

          echo "derived-data-path=$derived_data_path" >> $GITHUB_OUTPUT
          echo "derived-data-path-customized=$derived_data_path_customized" >> $GITHUB_OUTPUT

      - name: Build
        if: ${{ !steps.check-cached-output.outputs.cache-hit }}
        env:
          DERIVED_DATA_PATH: ${{ steps.get-derived-data-path.outputs.derived-data-path }}
          ARCHIVE_PATH: ${{ steps.get-built-app-info.outputs.built-archive-path }}
        run: |
          set -o pipefail # Since we pipe the output to xcpretty, we need this to fail this step if `xcrun xcodebuild` fails

          xcode-select --print-path

          xcrun xcodebuild -scheme '${{ env.ios_app_name }}' \
            -workspace 'ios/${{ env.ios_app_name }}.xcworkspace' \
            -configuration ${{ inputs.configuration }} \
            ${{ inputs.destination == 'iOS-Simulator' && '-sdk iphonesimulator -destination "generic/platform=iOS Simulator"' || '-sdk iphoneos -destination "generic/platform=iOS"' }} \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            ${{ inputs.type == 'build' && 'build' || 'archive' }} | tee xcodebuild.log | xcpretty

      - name: Copy Built App to Build Directory
        if: ${{ !steps.check-cached-output.outputs.cache-hit && inputs.type == 'build' && steps.get-derived-data-path.outputs.derived-data-path-customized }}
        env:
          DERIVED_DATA_PATH: ${{ steps.get-derived-data-path.outputs.derived-data-path }}
          RELATIVE_BUILT_APP_PATH: ${{ steps.get-built-app-info.outputs.relative-built-app-path }}
          BUILT_APP_PATH: ${{ steps.get-built-app-info.outputs.built-app-path }}
        run: |
          mkdir -p "$(dirname "$BUILT_APP_PATH")"
          cp -R "$DERIVED_DATA_PATH/$RELATIVE_BUILT_APP_PATH" "$BUILT_APP_PATH"

      - name: Save Built App to Cache
