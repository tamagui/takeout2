appId: com.takeout.app.dev
---
# Debug OTP input - stops immediately after entering OTP

- launchApp:
    clearState: true

# Handle dev server picker (appears after clearState)
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
      - extendedWaitUntil:
          notVisible: "DEVELOPMENT SERVERS"
          timeout: 20000

# Handle dev menu onboarding (appears after first connect)
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

# Handle dev menu tools screen (close button)
- runFlow:
    when:
      visible:
        id: "xmark"
    commands:
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd

# Wait for login screen
- extendedWaitUntil:
    visible: "Login to Takeout"
    timeout: 30000

# Navigate to email input
- tapOn: "Continue with Email"
- extendedWaitUntil:
    visible: "Sign in or sign up with your email."
    timeout: 10000

# Enter test email
- inputText: "maestrotest@example.com"
- hideKeyboard
- tapOn: "Next"

# Wait for OTP screen
- extendedWaitUntil:
    visible: "Enter Code"
    timeout: 30000

- takeScreenshot: debug-otp-before

# Get OTP from dev API
- runScript:
    file: ../scripts/get-otp.js
    env:
      EMAIL: "maestrotest@example.com"

# Enter OTP
- inputText: "${output.otp}"

# Take screenshot immediately after
- takeScreenshot: debug-otp-after

# Stop here - don't wait for anything else
