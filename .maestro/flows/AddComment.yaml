appId: dev.tamagui.takeout.dev
tags:
  - feed
---
- runFlow: Login.yaml
# wait for feed to load
- extendedWaitUntil:
    visible: 'demo'
    timeout: 30000
# scroll to the seed post
- scrollUntilVisible:
    element: 'morning coffee vibes'
    timeout: 30000
    centerElement: true
# tap the post image to navigate to detail
# the image is below the caption text, tap relative to it
- tapOn:
    text: 'morning coffee vibes'
    retryTapIfNoChange: false
# try tapping lower on the post (where the image is)
- swipe:
    direction: UP
    duration: 300
# look for the comment count near the seed post and tap it
- tapOn:
    text: '11'
    optional: true
- tapOn:
    text: '2'
    optional: true
# wait for post detail
- extendedWaitUntil:
    visible: 'sarahc|marcusj|love this'
    timeout: 15000
# tap the comment input (fixed at bottom of screen)
- tapOn:
    id: 'comment-input'
# type a comment
- inputText: 'test comment from maestro'
# tap submit
- tapOn:
    id: 'comment-submit'
# verify the comment appears
- extendedWaitUntil:
    visible: 'test comment from maestro'
    timeout: 10000
