# smoke test: after login, verify navigation through all bottom tabs.
# the tab bar is icon-only with no text labels, so we tap by position.
# tab positions (% of screen width): feed≈27%, ai≈42%, search≈58%, profile≈73%
# tab bar bottom edge is approximately 8-12% from the bottom of the screen.
appId: dev.tamagui.takeout.dev
tags:
  - navigation
---
- runFlow: Login.yaml

# should start on the feed tab - assert feed header is visible
- assertVisible: 'Takeout'

# tap search tab (3rd icon, ~58% from left, ~91% from top on standard screen)
- tapOn:
    point: '58%,91%'

# search screen should show some recognizable element; wait briefly for transition
- wait:
    forAnimationToEnd: true

# tap profile tab (4th icon, ~73% from left)
- tapOn:
    point: '73%,91%'

# wait for profile screen to load
- wait:
    forAnimationToEnd: true

# tap back to feed tab (1st icon, ~27% from left)
- tapOn:
    point: '27%,91%'

# confirm we are back on the feed
- assertVisible: 'Takeout'
