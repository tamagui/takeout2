name: Build iOS App - Cached
env:
  # Relative path from the monorepo root to the app. Use `./` if the app is in the root.
  app_project_path: ./
  # Should match the name of "ios/<app_name>.xcworkspace"
  ios_app_name: Start
  # A unique ID to identify the app on GitHub Actions. This is used as part of cache keys and artifact names and must be unique among all workflows if you have multiple workflows for building different apps.
  app_id: ios-rn-app
  # A list of file paths. This is used to calculate a hash to identify the build. If any of these files change, the build hash will change and the app will be rebuilt.
  file_paths_for_hash:
    .xcode-version
    bun.lock
    app.config.ts
    assets/icon-app.png

on:
  workflow_dispatch:
    inputs:
      # NOTE: Keep these input definitions in sync with workflow_call inputs below
      configuration:
        description: "Either 'Debug' or 'Release'"
        type: choice
        options:
          - Debug
          - Release
        required: true
      destination:
        description: "'iOS-Simulator' or 'iOS'"
        type: choice
        options:
          - iOS-Simulator
          - iOS
        default: 'iOS-Simulator'
      type:
        description: "'build' or 'archive'"
        type: choice
        options:
          - build
          - archive
        default: 'build'

  workflow_call:
    # NOTE: Keep these input definitions in sync with workflow_dispatch inputs above
    inputs:
      configuration:
        description: "Either 'Debug' or 'Release'."
        type: string
        required: true
      destination:
        description: "'iOS-Simulator' or 'iOS'"
        type: string
        default: 'iOS-Simulator'
      type:
        description: "'build' or 'archive'"
        type: string
        default: 'build'

    outputs:
      output-cache-key:
        description: "The GitHub Actions cache key of the built .app or archive, can be used in subsequent workflows to get the built app from cache using this key."
        value: ${{ jobs.calculate-cache-key.outputs.cache-key }}
      output-path:
        description: "The path to the built .app or archive file, relative to the repository root."
        value: ${{ jobs.build-ios-native.outputs.output-path }}
      built-app-path:
        description: "The path to the built .app, relative to the repository root."
        value: ${{ jobs.build-ios-native.outputs.built-app-path }}
      built-archive-path:
        description: "The path to the built archive file, relative to the repository root."
        value: ${{ jobs.build-ios-native.outputs.built-archive-path }}
      output-artifact-name:
        description: "The ID of the uploaded artifact which contains the built .app or archive file. Will be empty if artifact upload is not enabled."
        value: ${{ jobs.build-ios-native.outputs.output-artifact-name }}

jobs:
  calculate-cache-key:
    name: Calculate Cache Key
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.calculate-cache-key.outputs.cache-key }}
      hash: ${{ steps.calculate-hash.outputs.hash }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate Hash
        id: calculate-hash
        env:
          FILES: ${{ env.file_paths_for_hash }}
        # TODO: Here we may also want to run `expo config` and use the JSON output as part of the hash.
        run: |
          hash=$(echo "$FILES" | xargs cat | sha1sum | awk '{print $1}')
          echo "Hash: $hash"
          echo "hash=$hash" >> $GITHUB_OUTPUT
      - name: Compose Cache Key
        id: calculate-cache-key
        env:
          KEY_PREFIX: ${{ env.app_id }}-${{ inputs.destination }}-${{ inputs.configuration }}-${{ inputs.type }}
          HASH: ${{ steps.calculate-hash.outputs.hash }}
        run: |
          cache_key="${KEY_PREFIX}-${HASH}"
          echo "Cache Key: $cache_key"
          echo "cache-key=$cache_key" >> $GITHUB_OUTPUT

  build-ios-native:
    name: Build iOS Native
    needs: calculate-cache-key
    uses: ./.github/workflows/build-ios-app.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    with:
      configuration: ${{ inputs.configuration }}
      destination: ${{ inputs.destination }}
      type: ${{ inputs.type }}
      output-cache-key: ${{ needs.calculate-cache-key.outputs.cache-key }}

  build-ios-js:
    name: Build iOS JS
    needs:
      - calculate-cache-key
      - build-ios-native
    runs-on: [macOS, sequoia-xcode-beta]
    defaults:
      run:
        working-directory: ${{ env.app_project_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Installed Xcodes
        run: xcodes installed

      - name: Select Xcode
        run: xcodes select "$(cat .xcode-version)"

      - name: Install
        uses: ./.github/actions/install

      - name: Write Public Env Into .env
        env:
          PUBLIC_ENV: ${{ vars.PUBLIC_ENV }}
        run:
          echo "${PUBLIC_ENV}" >> .env

      - name: Prebuild
        run: |
          npx --yes expo prebuild --platform ios --no-install

      # - name: Cache Pods
      #   if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
      #   uses: actions/cache@v4
      #   env:
      #     cache-name: ${{ env.app_id }}-pods
      #   with:
      #     path: ${{ env.app_project_path }}/ios/Pods
      #     key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles(format('{0}/ios/Podfile', env.app_project_path)) }}
      #     restore-keys: |
      #       ${{ runner.os }}-${{ env.cache-name }}-

      - name: Pod Install
        run: |
          pod install --project-directory=ios

      - name: Download Cached Native Build
        uses: actions/cache/restore@v4
        with:
          path: ${{ needs.build-ios-native.outputs.output-path }}
          key: ${{ needs.calculate-cache-key.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build JS Bundle
        env:
          APP_NAME: ${{ env.ios_app_name }}
          CONFIGURATION: ${{ inputs.configuration }}
          RELATIVE_APP_LOCATION: ${{ inputs.type == 'build' && needs.build-ios-native.outputs.built-app-path || format('{0}/Products/Applications/{1}.app', needs.build-ios-native.outputs.built-archive-path, env.ios_app_name) }}
        run: |
          export NODE_BINARY=node

          # [vxrn/one] React Native now defaults CLI_PATH to scripts/bundle.js, which loads the bundle command directly from @react-native/community-cli-plugin, we need to set it back to the main CLI endpoint so the override of the bundle command in react-native.config.cjs can take effect
          export CLI_PATH="$("$NODE_BINARY" --print "require('path').dirname(require.resolve('react-native/package.json')) + '/cli.js'")"

          xcode_env="$(
            xcrun xcodebuild -workspace "ios/$APP_NAME.xcworkspace" -scheme "$APP_NAME" -configuration "$CONFIGURATION" -showBuildSettings \
              | awk -F ' = ' '/^ *(PROJECT_DIR|TARGET_BUILD_DIR|UNLOCALIZED_RESOURCES_FOLDER_PATH|DERIVED_FILE_DIR|INFOPLIST_PATH|DWARF_DSYM_FOLDER_PATH|CONFIGURATION|SDK_NAME|PODS_ROOT) = / {print "export " $1 "=\"" $2 "\""}'
          )"
          echo "Xcode env:"
          echo "$xcode_env"
          echo ""
          eval "$xcode_env"

          echo "RELATIVE_APP_LOCATION=\"$RELATIVE_APP_LOCATION\""

          app_location="$(realpath "$RELATIVE_APP_LOCATION")"

          export CONFIGURATION_BUILD_DIR="$(dirname "$app_location")"
          echo "CONFIGURATION_BUILD_DIR=\"$CONFIGURATION_BUILD_DIR\""

          `node --print "require('path').dirname(require.resolve('react-native/package.json')) + '/scripts/react-native-xcode.sh'"`

      # TODO: may need to use PlistBuddy to update the Info.plist in the built app to ensure it has the right version, etc.

      - name: Upload Built App to Artifacts
        id: upload-built-app-artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ needs.build-ios-native.outputs.output-artifact-name }}
          path: |
            ${{ needs.build-ios-native.outputs.output-path }}
