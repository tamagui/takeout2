name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release mode
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=$(node -p "require('./packages/helpers/package.json').version")
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            git merge-base --is-ancestor HEAD origin/main
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=canary" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(node -p "require('./packages/helpers/package.json').version")
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == *"[skip canary]"* ]]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Commit explicitly skipped canary publishing."
            exit 0
          fi
          if [[ "$subject" == "v$version" ]]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Stable release commit; waiting for its v$version tag."
            exit 0
          fi

          base="$BEFORE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          subjects=$(git log --format=%s "$base..HEAD")
          if [[ -n "$subjects" ]] && ! grep -qEv '^docs(\([^)]*\))?!?:' <<< "$subjects"; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Push contains only conventional docs commits."
            exit 0
          fi

          echo "mode=canary" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.release.outputs.mode != 'skip'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        if: steps.release.outputs.mode != 'skip'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Install npm with trusted publishing support
        if: steps.release.outputs.mode != 'skip'
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        if: steps.release.outputs.mode != 'skip'
        run: bun install --frozen-lockfile

      - name: Publish canary
        if: steps.release.outputs.mode == 'canary'
        run: bun packages/scripts/src/release.ts --canary --ci --dirty --skip-test --skip-finish

      - name: Publish stable release
        if: steps.release.outputs.mode == 'stable'
        run: bun packages/scripts/src/release.ts --ci --dirty --skip-version --skip-test --skip-finish
