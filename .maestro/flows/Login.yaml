appId: dev.tamagui.takeout.dev
tags:
  - auth
---
- runFlow: OpenApp.yaml
# if already on feed (logged in), skip login
- tapOn:
    id: 'login-as-demo'
    optional: true
# wait for feed to load
- extendedWaitUntil:
    visible: 'demo|Takeout'
    timeout: 30000
# give zero sync a moment
- swipe:
    direction: DOWN
    duration: 500
