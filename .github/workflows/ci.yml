name: takeout cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run build
        env:
          ALLOW_MISSING_ENV: "1"
          ONE_SERVER_URL: https://takeout.tamagui.dev
          BETTER_AUTH_URL: https://takeout.tamagui.dev
      - name: Check prepared Cloudflare worker
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: bun scripts/deploy-cloudflare.ts --prepare-only
        env:
          ONE_SERVER_URL: https://takeout.tamagui.dev
      - uses: actions/upload-artifact@v4
        with:
          name: takeout-cloudflare
          path: dist/
      - name: Deploy app and Lime Sync workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          bun scripts/deploy-cloudflare.ts
          printf '%s' "$BETTER_AUTH_SECRET" | bunx wrangler secret put BETTER_AUTH_SECRET --config dist/worker/wrangler.json
        env:
          ONE_SERVER_URL: https://takeout.tamagui.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.TAKEOUT_CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.TAKEOUT_BETTER_AUTH_SECRET }}
