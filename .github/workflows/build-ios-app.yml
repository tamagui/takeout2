        uses: actions/cache/save@v4
        with:
          key: ${{ inputs.output-cache-key }}
          path: ${{ steps.get-built-app-info.outputs.output-path }}

      - name: Upload Build Log
        uses: actions/upload-artifact@v4.3.1
        if:  ${{ !steps.check-cached-output.outputs.cache-hit && always() }}
        with:
          name: xcodebuild-${{ env.app_id }}-${{ inputs.destination }}-${{ inputs.configuration }}-${{ inputs.type }}.log
          path: |
            ${{ env.app_project_path }}/xcodebuild.log

