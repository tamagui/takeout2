appId: com.takeout.app.dev
---
# Test 6: Verify OTP Screen Elements
# Note: Requires backend to be running and accessible from simulator

- launchApp:
    clearState: true

# Handle dev server picker (appears after clearState)
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
      - extendedWaitUntil:
          notVisible: "DEVELOPMENT SERVERS"
          timeout: 20000

# Handle dev menu onboarding (appears after first connect)
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

# Handle dev menu tools screen (close button)
- runFlow:
    when:
      visible:
        id: "xmark"
    commands:
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd

# Wait for login screen
- extendedWaitUntil:
    visible: "Login to Takeout"
    timeout: 30000

# Navigate to email input
- tapOn: "Continue with Email"
- extendedWaitUntil:
    visible: "Sign in or sign up with your email."
    timeout: 10000

# Enter test email
- inputText: "otptest@example.com"

# Hide keyboard before tapping Next
- hideKeyboard

# Submit email
- tapOn: "Next"

# Wait for OTP screen with longer timeout
- extendedWaitUntil:
    visible: "Enter Code"
    timeout: 30000

# Verify all OTP screen elements
- assertVisible: "We sent a verification code to your email"
- assertVisible: "otptest@example.com"
